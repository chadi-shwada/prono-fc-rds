services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Heure de Paris (le conteneur tourne en UTC par défaut)
      TZ: Europe/Paris
      # SQLite persistée dans le volume app-data
      DATABASE_URL: "file:/data/prod.db"
      APP_SECRET: ${APP_SECRET}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_INVITE_CODE: ${SEED_INVITE_CODE}
      # Notifications push (Web Push) — générer avec: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - app-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Synchro automatique des résultats (scores en direct + points).
  # Intervalle court pendant le tournoi (défaut 120 s) pour un vrai « direct ».
  # Réglable via SYNC_INTERVAL_SECONDS dans le .env (ex. 600 hors tournoi).
  cron:
    image: alpine:3
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
      while true; do
        curl -s -H \"Authorization: Bearer $${CRON_SECRET}\" http://app:3000/api/cron/sync >/dev/null 2>&1 || true;
        sleep \"$${SYNC_INTERVAL_SECONDS:-120}\";
      done"
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
