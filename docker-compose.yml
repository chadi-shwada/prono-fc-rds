services:
  # ===================== Instance RATP (par défaut) =====================
  app:
    image: ghcr.io/chadi-shwada/prono-fc-rds:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Heure de Paris (le conteneur tourne en UTC par défaut)
      TZ: Europe/Paris
      # SQLite persistée dans le volume app-data
      DATABASE_URL: "file:/data/prod.db"
      APP_SECRET: ${APP_SECRET}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      APP_URL: ${NEXT_PUBLIC_SITE_URL}
      APP_NAME: ${APP_NAME:-Prono FC RDS}
      APP_TAGLINE: ${APP_TAGLINE:-entre collègues RATP}
      PREVIEW_NAMES: ${PREVIEW_NAMES:-Chadi,Moussa,Xavier}
      PRIZE: ${PRIZE:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_ADMIN_PIN: ${SEED_ADMIN_PIN:-}
      SEED_INVITE_CODE: ${SEED_INVITE_CODE}
      # Notifications push (Web Push) — générer avec: npx web-push generate-vapid-keys
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    volumes:
      - app-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sites additionnels (ex. instance Discord) déposés ici (vide = ignoré).
      - ./caddy-conf.d:/etc/caddy/conf.d:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  cron:
    image: alpine:3
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
      while true; do
        curl -s -H \"Authorization: Bearer $${CRON_SECRET}\" http://app:3000/api/cron/sync >/dev/null 2>&1 || true;
        sleep \"$${SYNC_INTERVAL_SECONDS:-120}\";
      done"
    depends_on:
      - app

  # Sauvegarde quotidienne de la base SQLite dans ./backups (visible sur le VPS
  # dans ~/prono/backups). Copie cohérente via l'API de backup de sqlite3
  # (sûre même pendant les écritures), rotation : 7 jours conservés.
  backup:
    image: alpine:3
    restart: unless-stopped
    volumes:
      - app-data:/data
      - ./backups:/backups
    command: >
      sh -c "apk add --no-cache sqlite >/dev/null 2>&1;
      while true; do
        ts=$$(date +%F);
        sqlite3 /data/prod.db \".backup '/backups/prod-$$ts.db'\"
          && echo \"backup OK: prod-$$ts.db\";
        ls -1t /backups/prod-*.db 2>/dev/null | tail -n +8 | xargs -r rm;
        sleep 86400;
      done"
    depends_on:
      - app

  # ============ Instance DISCORD (optionnelle, même VPS) ============
  # Ne démarre QUE si le profil « discord » est actif
  # (mets COMPOSE_PROFILES=discord dans le .env). Sans ça, l'instance RATP
  # ci-dessus tourne seule, inchangée.
  app-discord:
    image: ghcr.io/chadi-shwada/prono-fc-rds:latest
    restart: unless-stopped
    profiles: ["discord"]
    environment:
      NODE_ENV: production
      TZ: Europe/Paris
      DATABASE_URL: "file:/data/prod.db"
      APP_SECRET: ${DISCORD_APP_SECRET}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY}
      CRON_SECRET: ${DISCORD_CRON_SECRET}
      NEXT_PUBLIC_SITE_URL: ${DISCORD_SITE_URL}
      APP_URL: ${DISCORD_SITE_URL}
      APP_NAME: ${DISCORD_APP_NAME:-Pronos}
      APP_TAGLINE: ${DISCORD_APP_TAGLINE:-entre potes}
      PREVIEW_NAMES: ${DISCORD_PREVIEW_NAMES:-Chadi,Procy,Andrew}
      PRIZE: ${DISCORD_PRIZE:-1 mois de Discord Nitro}
      SEED_ADMIN_NAME: ${DISCORD_SEED_ADMIN_NAME}
      SEED_INVITE_CODE: ${DISCORD_SEED_INVITE_CODE}
      VAPID_PUBLIC_KEY: ${DISCORD_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${DISCORD_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${DISCORD_VAPID_SUBJECT:-}
      # Connexion + annonces Discord
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # ID Discord de l'admin (promu automatiquement à la connexion)
      DISCORD_ADMIN_ID: ${DISCORD_ADMIN_ID:-}
      # Pas d'easter egg sur l'instance Discord
      EASTER_EGG_DISABLED: "1"
    volumes:
      - discord-data:/data
    expose:
      - "3000"

  cron-discord:
    image: alpine:3
    restart: unless-stopped
    profiles: ["discord"]
    environment:
      CRON_SECRET: ${DISCORD_CRON_SECRET}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-120}
    command: >
      sh -c "apk add --no-cache curl >/dev/null 2>&1;
      while true; do
        curl -s -H \"Authorization: Bearer $${CRON_SECRET}\" http://app-discord:3000/api/cron/sync >/dev/null 2>&1 || true;
        sleep \"$${SYNC_INTERVAL_SECONDS:-120}\";
      done"
    depends_on:
      - app-discord

volumes:
  app-data:
  discord-data:
  caddy-data:
  caddy-config:
