name: Déploiement prod

# Déclenché à chaque push sur main (+ bouton « Run workflow » manuel).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Vérification : on ne déploie PAS si le code ne compile pas ---
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit

      # --- Build de l'image SUR LE RUNNER (puissant) puis push vers GHCR ---
      # Plus aucun build sur le VPS → il ne sature plus pendant les déploiements.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Déploiement vers le VPS ---
      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      # L'image est sur GHCR : le déploiement réel est fait par le VPS lui-même
      # (cron qui « docker compose pull »), car la connexion entrante GitHub → VPS
      # est régulièrement bloquée par le réseau de l'hébergeur.
      # Ces 2 étapes ne sont donc qu'un « coup de pouce » pour déployer tout de
      # suite quand le VPS est joignable — elles ne FONT PAS échouer le workflow.
      - name: Envoyer la config (rsync, best-effort)
        continue-on-error: true
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.env' \
            -e "ssh -4 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=15" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/prono/"

      - name: Déployer maintenant si joignable (best-effort)
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | ssh -4 -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin && cd ~/prono && docker compose pull && docker compose up -d && docker image prune -f"
